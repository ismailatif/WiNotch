name: Build and Release WinNotch.exe

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows Executable (.exe)
        run: |
          pyinstaller --noconsole --onefile --clean --name "WinNotch" --icon "app.ico" island.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNotch-windows
          path: dist/WinNotch.exe

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          files: dist/WinNotch.exe
          tag_name: ${{ github.event.release.tag_name || github.ref_name || 'v1.0.0' }}
          name: ${{ github.event.release.name || github.ref_name || 'WinNotch v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true


